apiVersion: v1
kind: Service
metadata:
  name: {{ include "product-master.fullname" . }}
  labels:
    {{- include "product-master.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  # component=api keeps this Service off the mcp pods, which share the
  # name/instance labels (tests/test_service_selectors.py).
  selector:
    {{- include "product-master.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
