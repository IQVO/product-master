# Used by `helm lint` / `ct lint`: every optional component enabled at once.
database:
  existingSecret: "product-master-db"
config:
  eventPublisher: "kafka"
  outboxRelayInterval: "500ms"
  legacyImportConsumerGroup: "product-master-legacy-import"
  shutdownDrainDelay: "5s"
  corsAllowedOrigins: "http://localhost:5173"
kafka:
  enabled: true
  brokers: "kafka.warehouse-systems.svc.cluster.local:9092"
gatewayApi:
  enabled: true
  parentRefs:
    - name: warehouse-gateway
      namespace: kong
      sectionName: http
  hosts:
    - path: /api/product-master
      pathType: PathPrefix
autoscaling:
  api:
    enabled: true
mcp:
  enabled: true
analytics:
  enabled: true
  database:
    # Dummy DSNs, no password (a real one comes from a Secret in the cluster).
    projectorUrl: "postgres://projector@example.invalid:5432/product_master_analytics"
    reportsUrl: "postgres://reports@example.invalid:5432/product_master_analytics"

frontend:
  enabled: true
