asyncapi: 2.6.0

info:
  title: product-master Domain Events
  version: "1.0.0"
  contact:
    name: product-master maintainers
    url: https://github.com/IQVO/product-master
    email: product-master@iqvo.example.com
  license:
    name: UNLICENSED
  description: |
    Event catalog for the **product-master** bounded context (WMS subdomain):
    SKU-level product master data, i.e. handling classification and the
    physical profile (ADR 0001, ADR 0002).

    **Published.** The `Product` aggregate raises five events, published to
    `warehouse.product-master.events` through a **transactional outbox**: the
    product row and its already-encoded events are written in ONE database
    transaction and a relay drains them to Kafka (at-least-once; the CloudEvents
    `id` is stored with the outbox row, so a retry republishes the same `id`).
    A change that alters nothing raises no event.

    **Local copies, not lookups.** Sibling contexts (inventory-storage,
    order-management, wes-work-planning, fulfillment-execution) keep a local
    copy keyed by SKU. Every payload carries the aggregate `version` after the
    change; apply a message only when its `version` is greater than the stored
    one. Payloads are full-state per concern (classification, physical profile),
    so a consumer overwrites, it never merges.

    **Consumed (migration only, ADR 0003).** inventory-storage's legacy
    `ProductClassified` on `warehouse.inventory.events`, read by the legacy
    importer when `LEGACY_IMPORT_CONSUMER_GROUP` is set.

    **Envelope (mandatory).** CloudEvents 1.0, structured content mode, Kafka
    header `content-type: application/cloudevents+json; charset=UTF-8`.
    `specversion`, `id`, `source` (`/warehouse/product-master`), `type`,
    `subject` (the SKU), `time`, `datacontenttype` (`application/json`) and
    `dataschema` (`urn:warehouse:product-master:events:<EventName>:v1`) are all
    required. Kafka key = the SKU. Type =
    `com.warehouse.wms.product-master.product.<EventName>`. A breaking payload
    change is a new `.v2` type, never a mutation.

servers:
  production:
    url: "{brokers}"
    protocol: kafka
    description: Fleet-shared Kafka broker (host supplied by the deployment environment).
    variables:
      brokers:
        default: "kafka.warehouse-systems.internal:9092"

defaultContentType: application/cloudevents+json

tags:
  - name: product-master
    description: The product-master bounded context (WMS subdomain).
  - name: product
    description: Events raised by the Product aggregate.
  - name: consumed
    description: Events produced by sibling contexts that this service consumes (migration only).

channels:
  warehouse.product-master.events:
    description: |
      This service's integration topic. Written by the outbox relay; key = SKU;
      every message carries the CloudEvents content-type header. Dispatch on the
      full `type`, ignore unknown types, dedupe on `id`, apply by `version`.
    subscribe:
      operationId: receiveProductEvents
      summary: Receive Product events.
      description: |
        Subscribe to the product master data stream. Route on the full `type`
        (`com.warehouse.wms.product-master.product.<EventName>`).
      tags:
        - name: product
      message:
        oneOf:
          - $ref: "#/components/messages/ProductRegistered"
          - $ref: "#/components/messages/ProductDescriptionChanged"
          - $ref: "#/components/messages/ProductClassified"
          - $ref: "#/components/messages/ProductDimensionsDeclared"
          - $ref: "#/components/messages/ProductMeasured"

  warehouse.inventory.events:
    description: |
      inventory-storage's integration topic. Consumed ONLY by the legacy
      importer during the migration (ADR 0003), with a stable consumer group
      read from env `LEGACY_IMPORT_CONSUMER_GROUP` (unset = not started). Every
      type other than inventory-storage's `ProductClassified` is ignored.
    publish:
      operationId: consumeLegacyProductClassified
      summary: Consume inventory-storage's legacy ProductClassified.
      description: |
        Imports a classification authored in inventory-storage. Unknown SKUs
        are registered; a classification authored in product-master
        (`classification_source=native`) is never overwritten. The CloudEvents
        `id` claim and the effect commit in one transaction; the offset is
        committed afterwards.
      tags:
        - name: consumed
      message:
        $ref: "#/components/messages/LegacyProductClassified"

components:
  messages:
    ProductRegistered:
      name: ProductRegistered
      title: Product registered
      summary: A SKU was registered as a product.
      description: "`type` = `com.warehouse.wms.product-master.product.ProductRegistered`; subject and key = the SKU."
      contentType: application/cloudevents+json
      tags:
        - name: product
      payload:
        $ref: "#/components/schemas/ProductRegisteredEvent"
      examples:
        - name: registered
          summary: SKU-1 registered.
          payload:
            specversion: "1.0"
            id: "1b0c9a4e-2f7d-4a63-9d1e-5a7c3e2b9f10"
            source: "/warehouse/product-master"
            type: "com.warehouse.wms.product-master.product.ProductRegistered"
            subject: "SKU-1"
            time: "2026-10-06T21:00:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:product-master:events:ProductRegistered:v1"
            data:
              sku: "SKU-1"
              description: "Lithium battery pack 12V"
              version: 1

    ProductDescriptionChanged:
      name: ProductDescriptionChanged
      title: Product description changed
      summary: A registered product's description changed.
      description: "`type` = `com.warehouse.wms.product-master.product.ProductDescriptionChanged`; subject and key = the SKU."
      contentType: application/cloudevents+json
      tags:
        - name: product
      payload:
        $ref: "#/components/schemas/ProductDescriptionChangedEvent"
      examples:
        - name: described
          summary: SKU-1's description changed.
          payload:
            specversion: "1.0"
            id: "8d3f2c1a-6b5e-4f7a-9c0d-1e2f3a4b5c6d"
            source: "/warehouse/product-master"
            type: "com.warehouse.wms.product-master.product.ProductDescriptionChanged"
            subject: "SKU-1"
            time: "2026-10-06T21:01:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:product-master:events:ProductDescriptionChanged:v1"
            data:
              sku: "SKU-1"
              description: "Lithium battery pack 12V, 7Ah"
              version: 2

    ProductClassified:
      name: ProductClassified
      title: Product classified
      summary: A product's handling classification was set or replaced.
      description: |
        `type` = `com.warehouse.wms.product-master.product.ProductClassified`;
        subject and key = the SKU. Full-state replacement of the
        classification. `sku`, `handling_tags`, `temperature_class` and
        `dot_hazard_class` keep the field names of inventory-storage's v1
        payload (ADR 0004). Optional fields are omitted when unset.
      contentType: application/cloudevents+json
      tags:
        - name: product
      payload:
        $ref: "#/components/schemas/ProductClassifiedEvent"
      examples:
        - name: hazmatFrozen
          summary: SKU-1 classified Hazmat + TemperatureSensitive (Frozen), DOT class 3.
          payload:
            specversion: "1.0"
            id: "0f6d8a2b-3c4e-4d5f-8a9b-7c6d5e4f3a2b"
            source: "/warehouse/product-master"
            type: "com.warehouse.wms.product-master.product.ProductClassified"
            subject: "SKU-1"
            time: "2026-10-06T21:02:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:product-master:events:ProductClassified:v1"
            data:
              sku: "SKU-1"
              handling_tags: ["Hazmat", "TemperatureSensitive"]
              temperature_class: "Frozen"
              dot_hazard_class: 3
              classification_source: "native"
              version: 3

    ProductDimensionsDeclared:
      name: ProductDimensionsDeclared
      title: Product dimensions declared
      summary: Declared unit dimensions and weight were set or replaced.
      description: |
        `type` = `com.warehouse.wms.product-master.product.ProductDimensionsDeclared`;
        subject and key = the SKU. Carries the FULL physical profile after the
        change (ADR 0002); act on `effective`.
      contentType: application/cloudevents+json
      tags:
        - name: product
      payload:
        $ref: "#/components/schemas/PhysicalProfileEvent"
      examples:
        - name: declared
          summary: SKU-1 declared at 200x120x80 mm, 1500 g.
          payload:
            specversion: "1.0"
            id: "5a4b3c2d-1e0f-4a9b-8c7d-6e5f4a3b2c1d"
            source: "/warehouse/product-master"
            type: "com.warehouse.wms.product-master.product.ProductDimensionsDeclared"
            subject: "SKU-1"
            time: "2026-10-06T21:03:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:product-master:events:ProductDimensionsDeclared:v1"
            data:
              sku: "SKU-1"
              declared: { length_mm: 200, width_mm: 120, height_mm: 80, weight_g: 1500, volume_mm3: 1920000 }
              effective: { length_mm: 200, width_mm: 120, height_mm: 80, weight_g: 1500, volume_mm3: 1920000 }
              effective_source: "declared"
              discrepancy: false
              version: 4

    ProductMeasured:
      name: ProductMeasured
      title: Product measured
      summary: A measurement of one unit was recorded and is now effective.
      description: |
        `type` = `com.warehouse.wms.product-master.product.ProductMeasured`;
        subject and key = the SKU. Carries the FULL physical profile after the
        change (ADR 0002); act on `effective`.
      contentType: application/cloudevents+json
      tags:
        - name: product
      payload:
        $ref: "#/components/schemas/PhysicalProfileEvent"
      examples:
        - name: measuredWithDiscrepancy
          summary: SKU-1 measured heavier than declared (more than 10 %).
          payload:
            specversion: "1.0"
            id: "9e8d7c6b-5a4f-4e3d-8c2b-1a0f9e8d7c6b"
            source: "/warehouse/product-master"
            type: "com.warehouse.wms.product-master.product.ProductMeasured"
            subject: "SKU-1"
            time: "2026-10-06T21:04:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:product-master:events:ProductMeasured:v1"
            data:
              sku: "SKU-1"
              declared: { length_mm: 200, width_mm: 120, height_mm: 80, weight_g: 1500, volume_mm3: 1920000 }
              measured: { length_mm: 205, width_mm: 121, height_mm: 82, weight_g: 1720, volume_mm3: 2034010, measured_at: "2026-10-06T14:05:00Z", device_id: "CUBISCAN-03" }
              effective: { length_mm: 205, width_mm: 121, height_mm: 82, weight_g: 1720, volume_mm3: 2034010 }
              effective_source: "measured"
              discrepancy: true
              version: 5

    LegacyProductClassified:
      name: LegacyProductClassified
      title: inventory-storage ProductClassified (legacy, consumed)
      summary: inventory-storage's classification event, imported during the migration.
      description: |
        `type` = `com.warehouse.wms.inventory-storage.product.ProductClassified`,
        source `/warehouse/inventory-storage`, dataschema
        `urn:warehouse:inventory-storage:events:ProductClassified:v1`. Produced
        by inventory-storage (its ADR 0031); retired by its ADR 0033.
      contentType: application/cloudevents+json
      tags:
        - name: consumed
      payload:
        $ref: "#/components/schemas/LegacyProductClassifiedEvent"
      examples:
        - name: legacy
          summary: A legacy hazmat classification.
          payload:
            specversion: "1.0"
            id: "3c2b1a0f-9e8d-4c7b-a6f5-e4d3c2b1a0f9"
            source: "/warehouse/inventory-storage"
            type: "com.warehouse.wms.inventory-storage.product.ProductClassified"
            subject: "SKU-9"
            time: "2026-10-06T20:00:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:inventory-storage:events:ProductClassified:v1"
            data:
              sku: "SKU-9"
              handling_tags: ["Hazmat"]
              dot_hazard_class: 9

  schemas:
    CloudEventEnvelope:
      type: object
      required: [specversion, id, source, type, subject, time, datacontenttype, dataschema, data]
      properties:
        specversion: { type: string, const: "1.0" }
        id: { type: string, format: uuid }
        source: { type: string }
        type: { type: string }
        subject: { type: string, description: The SKU. }
        time: { type: string, format: date-time }
        datacontenttype: { type: string, const: application/json }
        dataschema: { type: string }

    HandlingTag:
      type: string
      enum: [Hazmat, Fragile, TemperatureSensitive, Oversized, HighValue]

    Dimensions:
      type: object
      required: [length_mm, width_mm, height_mm, weight_g, volume_mm3]
      properties:
        length_mm: { type: integer, minimum: 1, maximum: 20000 }
        width_mm: { type: integer, minimum: 1, maximum: 20000 }
        height_mm: { type: integer, minimum: 1, maximum: 20000 }
        weight_g: { type: integer, minimum: 1, maximum: 2000000 }
        volume_mm3: { type: integer, minimum: 1 }

    MeasuredDimensions:
      allOf:
        - $ref: "#/components/schemas/Dimensions"
        - type: object
          required: [measured_at]
          properties:
            measured_at: { type: string, format: date-time }
            device_id: { type: string, description: Omitted for a manual measurement. }

    ProductRegisteredEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [sku, description, version]
              properties:
                sku: { type: string }
                description: { type: string }
                version: { type: integer, minimum: 1 }

    ProductDescriptionChangedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [sku, description, version]
              properties:
                sku: { type: string }
                description: { type: string }
                version: { type: integer, minimum: 1 }

    ProductClassifiedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [sku, handling_tags, classification_source, version]
              properties:
                sku: { type: string }
                handling_tags:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/HandlingTag" }
                temperature_class: { type: string, enum: [Ambient, Chilled, Frozen] }
                dot_hazard_class: { type: integer, minimum: 1, maximum: 9 }
                classification_source: { type: string, enum: [native, legacy-import] }
                version: { type: integer, minimum: 1 }

    PhysicalProfileEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [sku, effective_source, discrepancy, version]
              properties:
                sku: { type: string }
                declared: { $ref: "#/components/schemas/Dimensions" }
                measured: { $ref: "#/components/schemas/MeasuredDimensions" }
                effective: { $ref: "#/components/schemas/Dimensions" }
                effective_source: { type: string, enum: [measured, declared, none] }
                discrepancy: { type: boolean }
                version: { type: integer, minimum: 1 }

    LegacyProductClassifiedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [sku, handling_tags]
              properties:
                sku: { type: string }
                handling_tags:
                  type: array
                  items: { $ref: "#/components/schemas/HandlingTag" }
                temperature_class: { type: string, enum: [Ambient, Chilled, Frozen] }
                dot_hazard_class: { type: integer, minimum: 1, maximum: 9 }
